framework:
  name: UNESCO 2001 Convention on the Protection of the Underwater Cultural Heritage
  purpose: "Operational monitoring support. This is not a legal compliance determination."
  source: https://www.unesco.org/en/legal-affairs/convention-protection-underwater-cultural-heritage

articles:
  "1": {focus: "Definition and scope", automatable: "context", required_site_fields: [name, year_estimate, type]}
  "2": {focus: "Objectives and general principles", automatable: "partial", indicators: [in_situ, commercial_exploitation, human_remains]}
  "3": {focus: "Consistency with UNCLOS", automatable: "context", required_site_fields: [maritime_zone]}
  "4": {focus: "Salvage and law of finds", automatable: "manual", indicators: [authorization_status]}
  "5": {focus: "Activities incidentally affecting UCH", automatable: "high", triggers: [construction, dredging, fishing, anchoring, sediment, pollution, coastal_erosion]}
  "6": {focus: "Bilateral regional or multilateral agreements", automatable: "manual", required_site_fields: [cooperation_partners]}
  "7": {focus: "Internal waters, archipelagic waters and territorial sea", automatable: "context", required_site_fields: [maritime_zone]}
  "8": {focus: "Contiguous zone", automatable: "context", required_site_fields: [maritime_zone]}
  "9": {focus: "Reporting and notification in EEZ and continental shelf", automatable: "partial", required_site_fields: [maritime_zone, reporting_channel]}
  "10": {focus: "Protection in EEZ and continental shelf", automatable: "partial", required_site_fields: [maritime_zone, coordinating_state, authorization_status]}
  "11": {focus: "Reporting and notification in the Area", automatable: "partial", required_site_fields: [maritime_zone, reporting_channel]}
