project:
  name: Pocket UCH
  version: "0.1.0"
  timezone: Asia/Jakarta

sources:
  tinyfish:
    enabled: true
    search_endpoint: https://api.search.tinyfish.ai
    fetch_endpoint: https://api.fetch.tinyfish.ai
    max_searches_per_run: 6
    max_results_per_query: 5
    max_fetches_per_run: 12
    run_once_per_day: true
    queries:
      - underwater cultural heritage shipwreck monitoring
      - underwater cultural heritage site damage
      - shipwreck archaeology storm sediment erosion
      - underwater archaeological site conservation
      - maritime archaeology shipwreck threat
      - submerged cultural heritage coastal development

  usgs_earthquakes:
    enabled: true
    url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson
  bmkg_earthquakes:
    enabled: true
    url: https://data.bmkg.go.id/DataMKG/TEWS/autogempa.json
  bmkg_marine:
    enabled: true
    base_url: https://maritim.bmkg.go.id/marine2026-data/
    metadata_url: https://maritim.bmkg.go.id/marine2026-data/meta/area_province.json
    locations_url: https://maritim.bmkg.go.id/marine2026-data/meta/wilmetos.min.geojson
  nasa_eonet:
    enabled: true
    url: https://eonet.gsfc.nasa.gov/api/v3/events
    params:
      status: open
      limit: 100
  copernicus_stac:
    enabled: true
    url: https://stac.dataspace.copernicus.eu/v1/
  gebco_wms:
    enabled: true
    url: https://www.gebco.net/data_and_products/gebco_web_services/web_map_service/mapserv

monitoring:
  default_radius_km: 100
  earthquake:
    min_magnitude: 4.5
  eonet:
    categories:
      - Wildfires
      - Severe Storms
      - Volcanoes
      - Earthquakes
      - Floods
      - Landslides
      - Drought
      - Dust Haze
      - Sea and Lake Ice
      - Snow
      - Temp Extremes
    max_age_days: 30
  sites_file: data/sites.json

output:
  data_file: data/data.json
  history_file: data/history.json
  status_file: data/status.json
  max_history_days: 180
