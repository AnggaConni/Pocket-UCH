project:
  name: Pocket UCH
  version: "0.2.0"
  schema_version: "0.3.0"
  timezone: Asia/Jakarta

sources:
  tinyfish:
    enabled: true
    coverage: global
    optional: true
    search_endpoint: https://api.search.tinyfish.ai
    fetch_endpoint: https://api.fetch.tinyfish.ai
    max_searches_per_run: 6
    max_results_per_query: 5
    max_fetches_per_run: 12
    run_once_per_day: true
    queries:
      - underwater cultural heritage shipwreck monitoring
      - underwater cultural heritage site damage
      - shipwreck archaeology storm sediment erosion
      - underwater archaeological site conservation
      - maritime archaeology shipwreck threat
      - submerged cultural heritage coastal development

  usgs_earthquakes:
    enabled: true
    coverage: global
    optional: false
    url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson
  bmkg_earthquakes:
    enabled: true
    coverage: Indonesia
    optional: true
    url: https://data.bmkg.go.id/DataMKG/TEWS/autogempa.json
  bmkg_marine:
    enabled: false
    coverage: Indonesia
    optional: true
    base_url: https://maritim.bmkg.go.id/marine2026-data/
    metadata_url: https://maritim.bmkg.go.id/marine2026-data/meta/area_province.json
    locations_url: https://maritim.bmkg.go.id/marine2026-data/meta/wilmetos.min.geojson
  nasa_eonet:
    enabled: true
    coverage: global
    optional: false
    url: https://eonet.gsfc.nasa.gov/api/v3/events
    params:
      status: open
      limit: 100
  gebco_wms:
    enabled: false
    coverage: global
    optional: false
    url: https://www.gebco.net/data_and_products/gebco_web_services/web_map_service/mapserv
  copernicus_stac:
    enabled: true
    coverage: global
    optional: false
    url: https://stac.dataspace.copernicus.eu/v1/search
    collections:
      - sentinel-2-l2a
      - sentinel-1-grd
    days_back: 30
    max_items_per_site: 5
  global_fishing_watch:
    enabled: true
    coverage: global
    optional: true
    url: https://gateway.api.globalfishingwatch.org/v3/4wings/report
    days_back: 7
    spatial_resolution: LOW
  marine_regions:
    enabled: true
    coverage: global
    optional: false
    wfs_url: https://geo.vliz.be/geoserver/MarineRegions/wfs
  emodnet_human_activities:
    enabled: true
    coverage: Europe
    optional: true
    wfs_url: https://ows.emodnet-humanactivities.eu/wfs
    max_layers_per_site: 3

monitoring:
  default_radius_km: 100
  satellite_radius_km: 5
  fishing_radius_km: 10
  maritime_zone_required: false
  global_mode: true
  earthquake:
    min_magnitude: 4.5
  eonet:
    categories:
      - Wildfires
      - Severe Storms
      - Volcanoes
      - Earthquakes
      - Floods
      - Landslides
      - Drought
      - Dust Haze
      - Sea and Lake Ice
      - Snow
      - Temp Extremes
    max_age_days: 30
  sites_file: data/sites.json

output:
  data_file: data/data.json
  history_file: data/history.json
  status_file: data/status.json
  tinyfish_state_file: data/tinyfish_state.json
  convention_rules_file: convention.yml
  baseline_days: 90
  max_history_days: 180
