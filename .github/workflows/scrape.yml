name: Pocket-UCH Scraper

on:
  workflow_dispatch:
  push:
    paths:
      - "scraper.py"
      - "inventory.py"
      - "uch_engine.py"
      - "tinyfish.py"
      - "config.yml"
      - "data/sites.json"
      - ".github/workflows/scrape.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
          UCH_PRIVATE_SITES_JSON: ${{ secrets.UCH_PRIVATE_SITES_JSON }}
        run: python scraper.py

      - name: Commit generated data
        run: |
          set -e
          git config user.name "pocket-uch-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add data/

            if git diff --cached --quiet; then
              echo "No generated data changes."
              exit 0
            fi

            git commit -m "chore: update UCH monitoring data"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race detected; retrying (${attempt}/3)..."
            git reset --mixed HEAD~1
            sleep 3
          done

          echo "Unable to push generated data after 3 attempts."
          exit 1
